<div class="route-vehicle-assignment-dialog">
  <mat-toolbar color="primary" class="dialog-header">
    <mat-icon>assignment</mat-icon>
    <span class="dialog-title">Chọn xe cho các tuyến</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="onCancel()" matTooltip="Đóng">
      <mat-icon>close</mat-icon>
    </button>
  </mat-toolbar>

  <div class="dialog-content">
    <!-- Simple Route List -->
    <div class="routes-container">
      <div *ngFor="let assignment of routeAssignments" class="route-item">
        <div class="route-info">
          <span class="route-name">Tuyến - {{ assignment.routeCode }}</span>
          <span class="employee-count">({{ assignment.employeeCount }} nhân viên)</span>
        </div>
        
        <div class="assignment-controls">
          <div class="vehicle-controls">
            <mat-form-field appearance="outline" class="vehicle-type">
              <mat-label>Loại xe</mat-label>
              <mat-select [value]="getVehicleType(assignment)"
                          (selectionChange)="onVehicleTypeChange(assignment.routeId, $event.value)">
                <mat-option value="TAXI">TAXI</mat-option>
                <mat-option value="16C">16C</mat-option>
                <mat-option value="29C">29C</mat-option>
                <mat-option value="45C">45C</mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="vehicle-select">
              <mat-label>Biển số xe</mat-label>
              <input matInput 
                     [value]="getLicensePlateNumber(assignment)"
                     (input)="onLicensePlateNumberChange(assignment.routeId, $event.target.value)"
                     placeholder="Nhập biển số">
            </mat-form-field>
          </div>

          <div class="driver-info">
            <mat-form-field appearance="outline" class="driver-name">
              <mat-label>Tên tài xế</mat-label>
              <input matInput 
                     [value]="assignment.assignedDriver.driverName"
                     (input)="onDriverNameChange(assignment.routeId, $event.target.value)"
                     placeholder="Nhập tên tài xế">
            </mat-form-field>

            <mat-form-field appearance="outline" class="driver-phone">
              <mat-label>Số điện thoại</mat-label>
              <input matInput 
                     [value]="assignment.assignedDriver.phoneNumber"
                     (input)="onDriverPhoneChange(assignment.routeId, $event.target.value)"
                     placeholder="Nhập số điện thoại">
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button mat-button (click)="onCancel()" [disabled]="isExporting">
      <mat-icon>cancel</mat-icon>
      Hủy
    </button>
    <button mat-raised-button 
            color="primary" 
            (click)="onExportPDF()" 
            [disabled]="!canExport() || isExporting">
      <mat-icon *ngIf="!isExporting">picture_as_pdf</mat-icon>
      <mat-spinner *ngIf="isExporting" diameter="20"></mat-spinner>
      {{ isExporting ? 'Đang xuất PDF...' : 'Xuất PDF' }}
    </button>
  </div>
</div>
